[project]
name = "skills"
version = "0.1.0"
license = {text = "MIT"}
authors = [
    { name = "Andrii Bogdanovych", email = "a@bogdanovych.org" }
]
requires-python = ">=3.10"
dependencies = [
    "mr-transcript>=0.1.2",
]
[dependency-groups]
dev = [
    "pre_commit",
    "ruff",

]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "preserve"
