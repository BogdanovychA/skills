[project]
name = "skills"
version = "0.1.0"
license = {text = "MIT"}
authors = [
    { name = "Andrii Bogdanovych", email = "a@bogdanovych.org" }
]
requires-python = ">=3.10"
dependencies = []
[dependency-groups]
dev = [
    "pre_commit",
    "black",
    "isort",

]

[tool.black]
line-length = 88
target-version = ['py310']
skip-string-normalization = true

[tool.isort]
profile = "black"
